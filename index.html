<!DOCTYPE html>

<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>

  .drag-stick{position:absolute;width:42px;height:42px;border:1px solid #777;border-radius:50%;background:#3332;pointer-events:none;transform:translate(-50%,-50%)}

  @media(max-width:730px){body{padding:8px}.board-wrap{padding:8px}.titlebar{padding:6px 10px}#board{height:clamp(240px,52dvh,480px)}.controls{display:flex;position:sticky;bottom:0;background:var(--paper);padding-bottom:max(12px,env(safe-area-inset-bottom))}#btnWrite{display:none}.play-footer{min-height:0}.hint-banner:empty{display:none}.hint-banner{font-size:12px}.scrim{position:fixed;padding:18px}.dialog{max-height:calc(100dvh - 36px)}}
  @media(hover:none){.controls{display:flex}#btnWrite{display:none}}
  @media(max-height:500px) and (pointer:coarse){body{padding:6px}.board-wrap{padding:6px}.titlebar{padding:2px 10px}#board{height:calc(100dvh - 145px)}.hint-banner{margin:6px 0;font-size:11px}.play-footer{min-height:0}.controls{position:fixed;right:12px;bottom:12px;width:auto;padding:0;background:transparent;z-index:4}#dragPad{display:none}.touch-write{min-height:44px}}
  .file-icon{width:15px;height:19px;border:1px solid #838b91;background:#fff;position:relative;flex-shrink:0}.file-icon:after{content:'';position:absolute;left:3px;right:3px;top:6px;height:1px;background:#a5abb0;box-shadow:0 4px #a5abb0,0 8px #a5abb0}
  .play-footer{border-top:1px solid #eee;padding-top:6px}.score{font-size:11px}.menu-btn{border:0;padding:8px;color:#777}.subtle{font-size:11px}
</style>

</head>
<body>
<main class="layout">
  <div class="window">
    <header class="titlebar">
      <span class="file-icon" aria-hidden="true"></span><span>untitled.txt</span>
      <span class="score"><span id="killCount">0</span> / <span id="totalEnemies">16</span> 흡수</span>
      <button class="menu-btn" id="btnPause" aria-label="일시정지">일시정지</button>
    </header>
    <div class="board-wrap">
      <div class="board-shell" id="boardShell">
        <canvas id="board" width="696" height="552" tabindex="0" aria-label="문자 미로. 방향키로 이동해 적의 뒤를 잡으세요."></canvas>
        <div id="scrim" class="scrim hidden">
          <div class="dialog" role="dialog" aria-labelledby="dialogTitle" aria-modal="true">
            <div class="meta" id="dialogMeta"></div>
            <h2 id="dialogTitle"></h2>

          </div>

      </div>
      <p id="hint" class="hint-banner" aria-live="polite"></p>
      <div class="play-footer">
        <span id="abilities" class="subtle">방향키 / WASD로 이동</span>
        <button class="write-btn" id="btnWrite" hidden>길 막기 · 0 <span class="keycap">SPACE</span></button>
      </div>
      <div class="controls" aria-label="모바일 조작">
        <div id="dragPad" class="drag-pad" aria-label="원하는 방향으로 드래그해 이동. 손을 떼면 멈춥니다.">드래그<span id="dragStick" class="drag-stick" hidden></span></div>
        <button id="btnMobileWrite" class="touch-write" hidden>길 막기 · 0</button>
      </div>
    </div>
  </div>
</main>
<script>
(()=>{'use strict';
  const W=85,H=67,CELL=24,canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
  const dirs={up:{x:0,y:-1,ch:'v'},right:{x:1,y:0,ch:'<'},down:{x:0,y:1,ch:'^'},left:{x:-1,y:0,ch:'>'}}; // Glyph means open mouth, not arrow tip.
  const names=Object.keys(dirs);
  const $=id=>document.getElementById(id);
  const state={map:[],revealed:[],revealAt:[],player:null,enemies:[],unlocks:new Set(),breached:new Set(),kills:0,stage:0,mode:'intro',held:null,lastPlayerStep:0,lastFrame:0,toastUntil:0,toastText:'',message:'',messageUntil:0,mute:true,particles:[],flash:0,absorbEvent:null,absorbed:[],trail:[],ink:0,walls:[],overview:false,writingAt:0,combo:0,bestCombo:0,lastKill:-Infinity,comboUntil:0,surgeUntil:0,notice:[]};
  let audio=null;
  let gameTime=0,lastTick=performance.now();
  const gameNow=()=>gameTime;
  const playerSpeed=()=>Math.min(1.4,1+state.kills*.07)+(gameNow()<state.surgeUntil?.15:0);
  const idx=(x,y)=>y*W+x;
  const valid=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
  const tile=(x,y)=>valid(x,y)?state.map[y][x]:'#';
  const setTile=(x,y,ch)=>{if(valid(x,y))state.map[y][x]=ch};
  const carve=(x,y)=>setTile(x,y,' ');
  const line=(x1,y1,x2,y2)=>{if(x1!==x2&&y1!==y2)throw new Error('Not orthogonal');const dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);for(let x=x1,y=y1;;x+=dx,y+=dy){carve(x,y);if(x===x2&&y===y2)break}};
  const rect=(x1,y1,x2,y2,fill)=>{for(let x=x1;x<=x2;x++){setTile(x,y1,fill);setTile(x,y2,fill)}for(let y=y1;y<=y2;y++){setTile(x1,y,fill);setTile(x2,y,fill)}};
  function buildMap(){
    releaseInput();
    state.map=Array.from({length:H},()=>Array(W).fill('#'));
    // Compact regional loops: keep choices close enough to read on a phone.
    const room=(x,y)=>{rect(x,y,x+8,y+8,' ');rect(x+2,y+2,x+6,y+6,' ');line(x+4,y,x+4,y+8);line(x,y+4,x+8,y+4);};
    room(38,17);room(50,27);room(38,39);room(26,27);
    line(42,25,42,28);line(40,25,40,28);
    line(46,31,50,31);line(46,21,54,21);line(54,21,54,27);
    line(42,34,42,39);line(34,31,38,31);
    line(46,43,54,43);line(54,35,54,43);
    line(30,35,30,43);line(30,43,38,43);
    line(30,21,38,21);line(30,21,30,27);
    rect(22,13,62,51,' ');rect(24,15,60,49,' ');
    for(const x of [28,56]){line(x,13,x,15);line(x,49,x,51)}
    for(const y of [19,43]){line(22,y,24,y);line(60,y,62,y)}
    line(42,13,42,17);line(42,47,42,51);line(22,31,26,31);line(58,31,62,31);
    [[42,16],[42,48],[25,31],[59,31]].forEach(([x,y])=>setTile(x,y,'%'));
    [[42,37],[35,31],[50,43],[34,43],[34,21]].forEach(([x,y])=>setTile(x,y,'&'));
    // Preserve the original 43-tile core, translated to the world centre.
    rect(37,27,47,35,'#');rect(38,28,46,34,' ');
    line(42,28,42,34);line(38,31,46,31);line(40,28,40,31);line(44,31,44,34);
    [[42,27],[40,27],[47,31],[42,35],[37,31],[50,21]].forEach(([x,y])=>setTile(x,y,'@'));
    state.revealed=Array(W*H).fill(false);
    state.revealAt=Array(W*H).fill(0);
    state.player={x:42,y:31,dir:'right',prevX:42,prevY:31,movedAt:0};state.camera={x:42.5*CELL,y:31.5*CELL};
    const spawns=[
      ['@',45,31,'right',0,999999,'tutorial'],['@',39,28,'left',0,880,'patrol'],
      ['&',46,23,'up',1,760,'hunter'],['@',38,19,'down',1,870,'wander'],
      ['&',52,27,'right',1,810,'ambusher'],['@',58,33,'up',1,900,'wander'],
      ['@',54,21,'left',1,920,'wander'],
      ['%',38,43,'down',2,750,'ambusher'],['&',46,45,'up',2,850,'hunter'],
      ['%',26,29,'down',2,790,'ambusher'],['@',34,33,'left',2,900,'wander'],
      ['&',30,23,'up',2,880,'wander'],
      ['@',34,13,'right',3,850,'hunter'],['&',60,22,'down',3,830,'hunter'],
      ['%',50,51,'left',3,780,'ambusher'],['@',22,40,'up',3,900,'wander']
    ];
    state.enemies=spawns.map(([ch,x,y,dir,zone,speed,style],i)=>({id:i+1,ch,x,y,prevX:x,prevY:y,movedAt:0,dir,zone,speed,style,wake:0,seenUntil:0,goal:null,turn:null,attackReadyAt:0,lastStep:0,alive:true}));
    // Early prey repeat short, observable loops until a genuine clue interrupts.
    for(const [id,route] of [[2,[[38,28],[38,31],[40,31],[40,28]]],[3,[[46,21],[42,21],[42,25],[46,25]]],[5,[[54,27],[54,31],[50,31],[50,27]]]]){
      const e=state.enemies.find(e=>e.id===id);e.patrol=route.map(([x,y])=>({x,y}));e.patrolIndex=0;
    }
    state.kills=0;state.stage=0;state.zoom=1.72;state.unlocks=new Set();state.breached=new Set();state.particles=[];state.flash=0;state.lastPlayerStep=0;state.lastFrame=0;state.held=null;state.absorbEvent=null;state.absorbed=[];state.trail=[];state.ink=0;state.walls=[];state.overview=false;state.writingAt=0;state.combo=0;state.bestCombo=0;state.lastKill=-Infinity;state.comboUntil=0;state.surgeUntil=0;state.notice=[];state.resumeMode='playing';state.deathReason='';state.noise=null;state.edit=null;state.started=false;state.message='';state.messageUntil=Infinity;$('hint').textContent=state.message;$('toast').classList.remove('show');
    reveal(0,true);updateUI();
  }
  function clearSight(x,y,tx,ty){
    let dx=Math.abs(tx-x),sx=x<tx?1:-1,dy=-Math.abs(ty-y),sy=y<ty?1:-1,err=dx+dy;
    while(x!==tx||y!==ty){const twice=2*err;if(twice>=dy){err+=dy;x+=sx}if(twice<=dx){err+=dx;y+=sy}if(x===tx&&y===ty)return true;if(!isFloor(x,y))return false;}return true;
  }
  function reveal(now,initial=false){
    state.visible=Array(W*H).fill(false);
    const p=state.player;
    if(initial)for(let y=27;y<=35;y++)for(let x=37;x<=47;x++)state.revealed[idx(x,y)]=true;
    for(let y=Math.max(0,p.y-8);y<=Math.min(H-1,p.y+8);y++)for(let x=Math.max(0,p.x-8);x<=Math.min(W-1,p.x+8);x++){
      if(Math.hypot(x-p.x,y-p.y)>8)continue;
      const i=idx(x,y);state.visible[i]=true;
      if(!state.revealed[i]){state.revealed[i]=true;state.revealAt[i]=initial?0:now}
    }
  }
  function hearEvent(x,y,now){
    const q=[[x,y,0,x,y]],seen=new Set([idx(x,y)]);
    for(let i=0;i<q.length;i++){
      const [cx,cy,distance,tx,ty]=q[i];
      for(const e of state.enemies)if(e.alive&&e.zone<=state.stage&&e.style!=='tutorial'&&e.x===cx&&e.y===cy){e.goal={x:tx,y:ty};e.seenUntil=now+2400;e.searchUntil=now+2400;e.clue='sound'}
      if(distance>=7)continue;
      for(const d of Object.values(dirs)){const nx=cx+d.x,ny=cy+d.y,ni=idx(nx,ny);if(valid(nx,ny)&&isFloor(nx,ny)&&!seen.has(ni)){seen.add(ni);q.push([nx,ny,distance+1,distance===0&&!isFloor(x,y)?nx:tx,distance===0&&!isFloor(x,y)?ny:ty])}}
    }
    state.noise={x,y,until:now+500};
  }
  function showMessage(message,ms=4000){state.message=message;state.messageUntil=ms===Infinity?Infinity:gameNow()+ms;$('hint').textContent=message}
  function toast(message,ms=2050){state.toastText=message;state.toastUntil=gameNow()+ms;$('toast').textContent=message;$('toast').classList.add('show')}
  function tone(freq=260,duration=.07,type='sine',volume=.025){if(state.mute)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;const t=audio.currentTime;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}catch(e){}}
  function tickSound(){tone(170,.025,'triangle',.009)}
  function isFloor(x,y){return tile(x,y)===' '}
  function enemyAt(x,y){return state.enemies.find(e=>e.alive&&e.x===x&&e.y===y)}
  function writeWall(now=gameNow()){
    if(state.mode!=='playing')return false;
    if(!state.unlocks.has('@')){toast('첫 @를 흡수해야 문자를 쓸 수 있어요.');return false}
    if(!state.ink){toast('먹물이 부족해요. 적을 먹으면 +1');return false}
    const d=dirs[state.player.dir],x=state.player.x+d.x,y=state.player.y+d.y;
    if(!valid(x,y)||tile(x,y)!==' '||enemyAt(x,y)){toast('빈 통로에만 + 벽을 쓸 수 있어요.');return false}
    state.edit={x,y,ch:'+',from:now,typing:true};
    state.ink--;state.walls.push({x,y,until:now+8000,from:now});setTile(x,y,'+');state.writingAt=now;
    // A blocked cell emits into its adjacent corridors; only the event location is shared.
    hearEvent(x,y,now);
    tone(520,.11,'square',.019);toast('+ 벽 생성 · 적이 다른 길로 돌아옵니다.',1700);
    showMessage('길을 막았다면 다른 순환로로 돌아가 적의 등을 노려 보세요.',3600);
    updateUI();return true;
  }
  function updateWalls(now){
    if(state.mode!=='playing')return;
    const alive=[];
    for(const wall of state.walls){if(now>=wall.until){if(tile(wall.x,wall.y)==='+')setTile(wall.x,wall.y,' ')}else alive.push(wall)}
    state.walls=alive;
  }
  function pigment(ch){return {'@':'#5D94B7','&':'#C48B60','%':'#9C76B4'}[ch]||'#555'}
  function saveRecord(){
    try{const old=loadRecord();
      const next={kills:Math.max(old.kills||0,state.kills),combo:Math.max(old.combo||0,state.bestCombo)};
      localStorage.setItem('text-hunter-v030-best',JSON.stringify(next));
    }catch(err){} // local-file privacy settings may block storage
  }
  function loadRecord(){
    try{const r=JSON.parse(localStorage.getItem('text-hunter-v030-best')||'{}');return {kills:Number.isFinite(r?.kills)?Math.max(0,r.kills):0,combo:Number.isFinite(r?.combo)?Math.max(0,r.combo):0}}
    catch(err){return {}}
  }
  function finalizeAbsorb(e,now){
    e.alive=false;state.kills++;
    state.combo=now-state.lastKill<5000?Math.min(9,state.combo+1):1;
    state.bestCombo=Math.max(state.bestCombo,state.combo);
    state.lastKill=now;state.comboUntil=now+5000;
    if(state.combo>=2){state.surgeUntil=now+3500;}
const first=!state.unlocks.has(e.ch);state.unlocks.add(e.ch);
    state.ink=Math.min(3,state.ink+1);
    if(state.combo===3){state.ink=Math.min(3,state.ink+1);toast('3연속! 먹물 보너스 +1',1500)}

    state.absorbed.push({ch:e.ch,color:pigment(e.ch)});
    state.edit={x:e.x,y:e.y,ch:e.ch,from:now};
    tone(340,.12,'triangle',.035);setTimeout(()=>tone(460,.17,'sine',.025),75);
    if(first&&e.ch==='@'){toast('@ 벽 통과 가능');showMessage('@',1500)}
    else if(first&&e.ch==='&'){toast('& 벽 통과 가능');showMessage('&',1500)}
    else if(first&&e.ch==='%'){toast('% 벽 통과 가능');showMessage('출구 ↑',3500)}
    else toast(e.ch+' 흡수 · '+(state.combo>=2?state.combo+'연속! 빠른 발동':'먹물 +1 · 속도 증가'));
    saveRecord();
    state.mode='playing';
    state.lastPlayerStep=now;state.held=drag?.dir||null;
    updateUI();
  }
  function startAbsorb(e,now){
    if(state.absorbEvent)return;
    state.absorbEvent={enemyId:e.id,from:now,until:now+290,ch:e.ch,x:e.x,y:e.y,ox:state.player.x,oy:state.player.y};
    state.mode='absorbing';
    state.held=null;
    tone(250,.05,'triangle',.02);
  }
  function die(now,why='정면에서 잡혔습니다.'){
    if(state.mode!=='playing')return;
    state.deathReason=why;saveRecord();state.mode='dead';state.held=null;state.flash=now+450;
    tone(150,.28,'sawtooth',.048);
    showMessage(why,Infinity);
    openDialog('dead');
  }
  function prepareAttack(e,now){
    if(!e.attackReadyAt||e.threatX!==state.player.x||e.threatY!==state.player.y){
      e.threatX=state.player.x;e.threatY=state.player.y;e.attackReadyAt=now+850;e.alertUntil=now+1500;e.windup=now;
      tone(180,.06,'triangle',.02);return true;
    }
    return now<e.attackReadyAt;
  }
  function canEat(e,oldX,oldY){const d=dirs[e.dir];return oldX===e.x-d.x&&oldY===e.y-d.y}
  function movePlayer(dirName,now=gameNow()){
    if(state.mode!=='playing')return false;
    if(!state.started){state.started=true;state.enemies.forEach(e=>{e.wake=now+1500;e.lastStep=now})}
    const d=dirs[dirName];if(!d)return false;
    state.lastPlayerStep=now;
    const p=state.player;const ox=p.x,oy=p.y;p.dir=dirName;
    const x=ox+d.x,y=oy+d.y;if(!valid(x,y))return false;
    const e=enemyAt(x,y);
    if(e){if(canEat(e,ox,oy)){startAbsorb(e,now)}else{die(now,'적의 정면 또는 측면에 부딪쳤습니다.');updateUI();return false}}
    else{
      const t=tile(x,y);
      if(t==='#'){tone(120,.045,'triangle',.012);return false}
      if(t!==' '&&t!=='+'&&!state.unlocks.has(t)){toast(t+' 적을 흡수해야 '+t+' 벽을 먹을 수 있습니다.',1500);tone(110,.06,'triangle',.017);return false}
      if(t!==' '){state.edit={x,y,ch:t,from:now};setTile(x,y,' ');tone(250,.095,'square',.024);if(t==='+'){state.walls=state.walls.filter(w=>w.x!==x||w.y!==y);toast('내가 쓴 벽을 지웠습니다.',800)}else if(!state.breached.has(t)){state.breached.add(t);state.stage=Math.max(state.stage,{'@':1,'&':2,'%':3}[t]);state.enemies.forEach(en=>{

      const cy=((e.prevY??e.y)+(e.y-(e.prevY??e.y))*ease+.5)*CELL;
      drawEnemyGlyph(cx,cy,e,now);

      if(e.turn){ctx.font='bold 14px monospace';ctx.fillStyle='#775f39';ctx.fillText({up:'↑',right:'→',down:'↓',left:'←'}[e.turn],cx,cy-17)}
      if(e.alertUntil>now){ctx.font='bold 13px Consolas,monospace';ctx.fillStyle='#a74c44';ctx.fillText('!',cx+13,cy-12)}
      else if(e.goal&&e.seenUntil>now){ctx.font='12px Consolas,monospace';ctx.fillStyle='#708291';ctx.fillText('?',cx+13,cy-12)}
    }
    const anim=state.absorbEvent;
    const t=anim?Math.min(1,Math.max(0,(now-anim.from)/290)):0;
    const travel=anim?(.78*(1-Math.pow(1-t,3))):0;
    const lerp=1-Math.pow(1-Math.min(1,Math.max(0,(now-p.movedAt)/105)),3);
    const pcx=anim?(p.x+.5)*CELL+(anim.x-anim.ox)*CELL*travel:((p.prevX??p.x)+(p.x-(p.prevX??p.x))*lerp+.5)*CELL;
    const pcy=anim?(p.y+.5)*CELL+(anim.y-anim.oy)*CELL*travel:((p.prevY??p.y)+(p.y-(p.prevY??p.y))*lerp+.5)*CELL;
    drawPlayerEvolution(pcx,pcy,p.dir,now);
    // One quiet insertion caret; visual only, never a target or body decoration.
    const caret=caretCell();
    if(caret&&(window.matchMedia('(prefers-reduced-motion: reduce)').matches||Math.floor(performance.now()/550)%2===0)){
      ctx.fillStyle='#555';ctx.fillRect(caret.x*CELL+3,caret.y*CELL+4,1.5,16);
    }
    const edit=state.edit;
    if(edit&&now-edit.from<160){
      const progress=Math.max(0,(now-edit.from)/160);
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='19px Consolas,monospace';
      if(!edit.typing){ctx.globalAlpha=1-progress;ctx.fillStyle='#777';ctx.fillText(edit.ch,(edit.x+.5)*CELL,(edit.y+.5)*CELL+1)}
      ctx.globalAlpha=1;ctx.fillStyle='#444';ctx.fillRect((edit.x+1)*CELL-3,edit.y*CELL+4,1.5,16);ctx.restore();
    }
    ctx.restore();
  }
  function frame(timestamp){
    const elapsed=Math.max(0,Math.min(100,timestamp-lastTick));lastTick=timestamp;
    if(state.mode==='playing'||state.mode==='absorbing')gameTime+=elapsed;
    const now=gameNow();
    if(state.mode==='playing'){
      updateWalls(now);
      const interval=145/playerSpeed();
      if(state.held&&now-state.lastPlayerStep>interval)movePlayer(state.held,now);
      for(const e of state.enemies){if(!state.started||!e.alive||e.zone>state.stage||now<e.wake)continue;if(now-e.lastStep>=e.speed){e.lastStep=now;aiStep(e,now)}}
    } else if(state.mode==='absorbing'&&state.absorbEvent){
      if(now>=state.absorbEvent.until){
        const target=state.enemies.find(e=>e.id===state.absorbEvent.enemyId&&e.alive);
        const ev=state.absorbEvent;
        state.absorbEvent=null;
        if(target){state.player.prevX=ev.ox;state.player.prevY=ev.oy;state.player.movedAt=now-100;state.player.x=ev.x;state.player.y=ev.y;state.trail.push({x:ev.ox,y:ev.oy,from:now,dir:state.player.dir});finalizeAbsorb(target,now);reveal(now)}
        else state.mode='playing';
      }
    }
    if(state.toastUntil&&now>state.toastUntil){$('toast').classList.remove('show');state.toastUntil=0}
    if(state.messageUntil!==Infinity&&now>state.messageUntil){state.messageUntil=Infinity;$('hint').textContent=''}
    if(now-state.lastFrame>25||state.mode!=='playing'){
      render(now);state.lastFrame=now
    }
    requestAnimationFrame(frame)
  }
  // Small deterministic hook for local automated smoke tests.
  window.__TEXT_HUNTER_TEST__={snapshot:()=>({mode:state.mode,x:state.player.x,y:state.player.y,dir:state.player.dir,kills:state.kills,stage:state.stage,absorb:state.absorbEvent?{...state.absorbEvent}:null,ink:state.ink,walls:state.walls.map(w=>({x:w.x,y:w.y})),overview:state.overview,combo:state.combo,bestCombo:state.bestCombo,absorbed:state.absorbed.map(a=>a.ch),unlocks:[...state.unlocks],held:state.held,visible:state.visible,started:state.started,caret:caretCell(),time:gameNow(),speed:playerSpeed(),enemies:state.enemies.filter(e=>e.alive).map(e=>({id:e.id,ch:e.ch,x:e.x,y:e.y,dir:e.dir,turn:e.turn,zone:e.zone,style:e.style,goal:e.goal,wake:e.wake,attackReadyAt:e.attackReadyAt,patrol:e.patrol||null,patrolIndex:e.patrolIndex??null})),map:state.map.map(r=>r.join(''))}),move:dir=>movePlayer(dir),reset:()=>buildMap()};
  buildMap();state.mode='playing';updateUI();requestAnimationFrame(frame);
})();
</script>
