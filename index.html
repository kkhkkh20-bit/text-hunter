<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>UNTITLED.TXT v0.32 — 문자 사냥</title>
<style>
  :root{--paper:#fbfbfa;--ink:#242424}*{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:#eeefed;color:var(--ink);font-family:Consolas,'Courier New',monospace}
  body{padding:24px}button{font:inherit;cursor:pointer;touch-action:manipulation}
  button:focus-visible,canvas:focus-visible{outline:2px solid #245d9c;outline-offset:3px}
  .layout{max-width:820px;margin:auto}.window{background:var(--paper);border:1px solid #c9c9c5}
  .titlebar{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid #ddd;font-size:13px}
  .score{margin-left:auto;color:#777;font-size:12px}.menu-btn{min-height:44px;padding:8px 12px;border:1px solid #ddd;background:transparent;color:#555}
  .board-wrap{padding:12px}.board-shell{position:relative;background:white;border:1px solid #e5e5e2;overflow:hidden}
  #board{width:100%;height:auto;display:block;touch-action:none;user-select:none}
  .hint-banner{font-size:13px;line-height:1.6;margin:12px 0;min-height:21px}
  .subtle{font-size:12px;color:#777;line-height:1.6}.play-footer{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:44px}
  .write-btn,.touch-write{padding:10px 14px;min-height:44px;border:1px solid #333;background:#292929;color:white;font-size:13px}
  button:disabled{background:#eee;color:#999;border-color:#ddd;cursor:default}.keycap{font-size:10px;opacity:.65}
  .controls{display:none;align-items:center;justify-content:center;gap:28px;padding:12px 0}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:6px;touch-action:none;user-select:none}
  .dir{border:1px solid #c0c0bc;color:#333;background:#f8f8f6;font-size:21px;touch-action:none;border-radius:4px}.dir:active{background:#deded9}
  .touch-write{min-width:100px;min-height:64px}
  .scrim{position:absolute;inset:0;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:10;padding:20px}
  .scrim.hidden{display:none}.dialog{width:min(400px,100%);background:white;border:1px solid #333;padding:24px;max-height:100%;overflow:auto}
  .meta{font-size:11px;color:#888}.dialog h2{font-size:24px;font-weight:500;margin:10px 0}.dialog p,.dialog li{font-size:13px;line-height:1.8;color:#555;word-break:keep-all}.dialog ul{padding-left:20px}
  .primary{padding:12px 20px;background:#252525;color:white;border:1px solid #252525;font-size:14px;min-height:44px}
  .toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:11;background:#252525;color:white;padding:10px 14px;font-size:12px;max-width:95%;opacity:0;pointer-events:none;line-height:1.5}.toast.show{opacity:1}
  @media(max-width:730px){body{padding:8px}.board-wrap{padding:8px}.titlebar{padding:6px 10px}.controls{display:flex;position:sticky;bottom:0;background:var(--paper);padding-bottom:max(12px,env(safe-area-inset-bottom))}#btnWrite{display:none}.play-footer{min-height:0}.hint-banner{font-size:12px}.scrim{position:fixed;padding:18px}.dialog{max-height:calc(100dvh - 36px)}}
  @media(hover:none){.controls{display:flex}#btnWrite{display:none}}
</style>

</head>
<body>
<main class="layout">
  <div class="window">
    <header class="titlebar">
      <strong>문자 사냥</strong>
      <span class="score"><span id="killCount">0</span> / <span id="totalEnemies">13</span> 흡수</span>
      <button class="menu-btn" id="btnPause" aria-label="일시정지">일시정지</button>
    </header>
    <div class="board-wrap">
      <div class="board-shell" id="boardShell">
        <canvas id="board" width="696" height="552" tabindex="0" aria-label="문자 미로. 방향키로 이동해 적의 뒤를 잡으세요."></canvas>
        <div id="scrim" class="scrim">
          <div class="dialog" role="dialog" aria-labelledby="dialogTitle" aria-modal="true">
            <div class="meta" id="dialogMeta"></div>
            <h2 id="dialogTitle"></h2>
            <p id="dialogBody"></p>
            <ul id="dialogList"></ul>
            <button class="primary" id="btnPrimary">시작</button>
          </div>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div>
      <p id="hint" class="hint-banner" aria-live="polite">적의 열린 쪽을 피해, 뒤에서 다가가세요.</p>
      <div class="play-footer">
        <span id="abilities" class="subtle">방향키 / WASD로 이동</span>
        <button class="write-btn" id="btnWrite" hidden>길 막기 · 0 <span class="keycap">SPACE</span></button>
      </div>
      <div class="controls" aria-label="모바일 조작">
        <div class="dpad">
          <span></span><button class="dir" data-dir="up" aria-label="위로 이동">↑</button><span></span>
          <button class="dir" data-dir="left" aria-label="왼쪽 이동">←</button>
          <button class="dir" data-dir="down" aria-label="아래로 이동">↓</button>
          <button class="dir" data-dir="right" aria-label="오른쪽 이동">→</button>
        </div>
        <button id="btnMobileWrite" class="touch-write" hidden>길 막기 · 0</button>
      </div>
    </div>
  </div>
</main>
<script>
(()=>{'use strict';
  const W=29,H=23,CELL=24,canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
  const dirs={up:{x:0,y:-1,ch:'v'},right:{x:1,y:0,ch:'<'},down:{x:0,y:1,ch:'^'},left:{x:-1,y:0,ch:'>'}}; // Glyph means open mouth, not arrow tip.
  const names=Object.keys(dirs);
  const $=id=>document.getElementById(id);
  const state={map:[],revealed:[],revealAt:[],player:null,enemies:[],unlocks:new Set(),breached:new Set(),kills:0,stage:0,mode:'intro',held:null,lastPlayerStep:0,lastFrame:0,toastUntil:0,toastText:'',message:'',messageUntil:0,mute:true,particles:[],flash:0,absorbEvent:null,absorbed:[],trail:[],ink:0,walls:[],overview:false,writingAt:0,combo:0,bestCombo:0,lastKill:-Infinity,comboUntil:0,surgeUntil:0,notice:[]};
  let audio=null;
  let gameTime=0,lastTick=performance.now();
  const gameNow=()=>gameTime;
  const playerSpeed=()=>Math.min(1.4,1+state.kills*.07)+(gameNow()<state.surgeUntil?.15:0);
  const idx=(x,y)=>y*W+x;
  const valid=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
  const tile=(x,y)=>valid(x,y)?state.map[y][x]:'#';
  const setTile=(x,y,ch)=>{if(valid(x,y))state.map[y][x]=ch};
  const carve=(x,y)=>setTile(x,y,' ');
  const line=(x1,y1,x2,y2)=>{if(x1!==x2&&y1!==y2)throw new Error('Not orthogonal');const dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);for(let x=x1,y=y1;;x+=dx,y+=dy){carve(x,y);if(x===x2&&y===y2)break}};
  const rect=(x1,y1,x2,y2,fill)=>{for(let x=x1;x<=x2;x++){setTile(x,y1,fill);setTile(x,y2,fill)}for(let y=y1;y<=y2;y++){setTile(x1,y,fill);setTile(x2,y,fill)}};
  function buildMap(){
    state.map=Array.from({length:H},()=>Array(W).fill('#'));
    // The outer world: concentric loops with multiple tactical shortcuts.
    rect(2,2,26,20,' ');rect(4,4,24,18,' ');
    line(14,2,14,20);line(2,11,26,11);
    line(8,2,8,4);line(20,2,20,4);line(8,18,8,20);line(20,18,20,20);
    line(4,7,4,15);line(24,7,24,15);
    line(2,6,4,6);line(24,16,26,16);line(2,16,4,16);line(24,6,26,6);
    // Outer perimeter of ring one; only & gates can connect these regions.
    rect(5,4,23,18,'#');
    rect(6,5,22,17,' ');rect(8,7,20,15,' ');
    line(14,5,14,17);line(6,11,22,11);
    line(8,5,8,7);line(20,5,20,7);line(8,15,8,17);line(20,15,20,17);
    line(6,8,8,8);line(20,14,22,14);
    // The starting maze never disappears. The @ wall is its only exit.
    rect(9,7,19,15,'#');
    rect(10,8,18,14,' ');line(14,8,14,14);line(10,11,18,11);
    line(12,8,12,11);line(16,11,16,14);
    // Exact one-cell gates. Nearby cells outside belong to the same map.
    [[14,7],[19,11],[14,15],[9,11]].forEach(([x,y])=>setTile(x,y,'@'));
    [[14,4],[23,11],[14,18],[5,11]].forEach(([x,y])=>setTile(x,y,'&'));
    // A late-game shortcut; acquiring % has a genuine use on the existing world.
    [[14,3],[14,19]].forEach(([x,y])=>setTile(x,y,'%'));
    // Keep non-removable walls as the permanent skeleton of the maze.
    for(let x=0;x<W;x++){setTile(x,0,'#');setTile(x,H-1,'#')}
    for(let y=0;y<H;y++){setTile(0,y,'#');setTile(W-1,y,'#')}
    state.revealed=Array(W*H).fill(false);
    state.revealAt=Array(W*H).fill(0);
    state.player={x:14,y:11,dir:'right',prevX:14,prevY:11,movedAt:0};
    const spawns=[
      // Initial zone: a stationary tutorial prey plus one slow opponent.
      ['@',17,11,'right',0,999999,'tutorial'],
      ['@',11,8,'left',0,880,'wander'],
      // First short expansion. Several routes offer actual hunting choices.
      ['&',20,8,'up',1,720,'hunter'],
      ['@',8,5,'down',1,820,'wander'],
      ['@',6,14,'right',1,920,'wander'],
      ['&',21,17,'left',1,810,'ambusher'],
      ['@',14,17,'up',1,960,'wander'],
      // Outer ring: stronger mix, only activates after the & barrier is opened.
      ['%',26,8,'down',2,690,'ambusher'],
      ['&',4,4,'down',2,880,'wander'],
      ['@',14,2,'right',2,930,'wander'],
      ['%',2,16,'up',2,770,'ambusher'],
      ['&',24,18,'left',2,900,'wander'],
      ['@',14,20,'up',2,850,'hunter']
    ];
    state.enemies=spawns.map(([ch,x,y,dir,zone,speed,style],i)=>({id:i+1,ch,x,y,prevX:x,prevY:y,movedAt:0,dir,zone,speed,style,wake:0,seenUntil:0,goal:null,turn:null,lastStep:0,alive:true}));
    state.kills=0;state.stage=0;state.zoom=1.72;state.unlocks=new Set();state.breached=new Set();state.particles=[];state.flash=0;state.lastPlayerStep=0;state.lastFrame=0;state.held=null;state.absorbEvent=null;state.absorbed=[];state.trail=[];state.ink=0;state.walls=[];state.overview=false;state.writingAt=0;state.combo=0;state.bestCombo=0;state.lastKill=-Infinity;state.comboUntil=0;state.surgeUntil=0;state.notice=[];state.resumeMode='playing';state.deathReason='';state.message='적의 열린 쪽을 피해, 뒤에서 다가가세요.';state.messageUntil=Infinity;$('hint').textContent=state.message;$('toast').classList.remove('show');
    reveal(0,true);updateUI();
  }
  function reveal(now,initial=false){
    const q=[[state.player.x,state.player.y,0]],visited=new Set([idx(state.player.x,state.player.y)]);
    const radius=initial?17:12;
    while(q.length){const [x,y,d]=q.shift(),i=idx(x,y);
      if(!state.revealed[i]){state.revealed[i]=true;state.revealAt[i]=initial?0:now}
      if(d>=radius)continue;
      for(const v of Object.values(dirs)){
        const nx=x+v.x,ny=y+v.y;if(!valid(nx,ny))continue;
        const ni=idx(nx,ny);if(!state.revealed[ni]){state.revealed[ni]=true;state.revealAt[ni]=initial?0:now}
        if(tile(nx,ny)===' '&&!visited.has(ni)){visited.add(ni);q.push([nx,ny,d+1])}
      }
    }
  }
  function showMessage(message,ms=4000){state.message=message;state.messageUntil=ms===Infinity?Infinity:gameNow()+ms;$('hint').textContent=message}
  function toast(message,ms=2050){state.toastText=message;state.toastUntil=gameNow()+ms;$('toast').textContent=message;$('toast').classList.add('show')}
  function tone(freq=260,duration=.07,type='sine',volume=.025){if(state.mute)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;const t=audio.currentTime;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration)}catch(e){}}
  function tickSound(){tone(170,.025,'triangle',.009)}
  function isFloor(x,y){return tile(x,y)===' '}
  function enemyAt(x,y){return state.enemies.find(e=>e.alive&&e.x===x&&e.y===y)}
  function writeWall(now=gameNow()){
    if(state.mode!=='playing')return false;
    if(!state.unlocks.has('@')){toast('첫 @를 흡수해야 문자를 쓸 수 있어요.');return false}
    if(!state.ink){toast('먹물이 부족해요. 적을 먹으면 +1');return false}
    const d=dirs[state.player.dir],x=state.player.x+d.x,y=state.player.y+d.y;
    if(!valid(x,y)||tile(x,y)!==' '||enemyAt(x,y)){toast('빈 통로에만 + 벽을 쓸 수 있어요.');return false}
    state.ink--;state.walls.push({x,y,until:now+8000,from:now});setTile(x,y,'+');state.writingAt=now;
    // A written mark is audible: nearby opponents inspect the writer's last position.
    for(const e of state.enemies){if(!e.alive||e.zone>state.stage||e.style==='tutorial')continue;
      if(Math.abs(e.x-x)+Math.abs(e.y-y)<=7){e.goal={x:state.player.x,y:state.player.y};e.seenUntil=now+2400;e.alertUntil=now+1200}
    }
    tone(520,.11,'square',.019);toast('+ 벽 생성 · 적이 다른 길로 돌아옵니다.',1700);
    showMessage('길을 막았다면 다른 순환로로 돌아가 적의 등을 노려 보세요.',3600);
    updateUI();return true;
  }
  function updateWalls(now){
    if(state.mode!=='playing')return;
    const alive=[];
    for(const wall of state.walls){if(now>=wall.until){if(tile(wall.x,wall.y)==='+')setTile(wall.x,wall.y,' ')}else alive.push(wall)}
    state.walls=alive;
  }
  function pigment(ch){return {'@':'#5D94B7','&':'#C48B60','%':'#9C76B4'}[ch]||'#555'}
  function saveRecord(){
    try{const old=loadRecord();
      const next={kills:Math.max(old.kills||0,state.kills),combo:Math.max(old.combo||0,state.bestCombo)};
      localStorage.setItem('text-hunter-v030-best',JSON.stringify(next));
    }catch(err){} // local-file privacy settings may block storage
  }
  function loadRecord(){
    try{const r=JSON.parse(localStorage.getItem('text-hunter-v030-best')||'{}');return {kills:Number.isFinite(r?.kills)?Math.max(0,r.kills):0,combo:Number.isFinite(r?.combo)?Math.max(0,r.combo):0}}
    catch(err){return {}}
  }
  function finalizeAbsorb(e,now){
    e.alive=false;state.kills++;
    state.combo=now-state.lastKill<5000?Math.min(9,state.combo+1):1;
    state.bestCombo=Math.max(state.bestCombo,state.combo);
    state.lastKill=now;state.comboUntil=now+5000;
    if(state.combo>=2){state.surgeUntil=now+3500;}
const first=!state.unlocks.has(e.ch);state.unlocks.add(e.ch);
    state.ink=Math.min(3,state.ink+1);
    if(state.combo===3){state.ink=Math.min(3,state.ink+1);toast('3연속! 먹물 보너스 +1',1500)}

    state.absorbed.push({ch:e.ch,color:pigment(e.ch)});
    state.flash=now+230;
    for(let i=0;i<13;i++){const a=Math.random()*Math.PI*2,s=10+Math.random()*48;state.particles.push({x:e.x*CELL+CELL/2,y:e.y*CELL+CELL/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,from:now,life:470+Math.random()*250,ch:e.ch})}
    tone(340,.12,'triangle',.035);setTimeout(()=>tone(460,.17,'sine',.025),75);
    if(first&&e.ch==='@'){toast('@ 벽 통과 가능');showMessage('@ 벽으로 이동해 새 길을 열어 보세요.',7000)}
    else if(first&&e.ch==='&'){toast('& 벽 통과 가능');showMessage('이제 & 벽을 지워 미로의 바깥 둘레를 열 수 있습니다.',7000)}
    else if(first&&e.ch==='%'){toast('% 벽 통과 가능');showMessage('% 벽이 빛납니다. 위아래 외곽 지름길을 뚫어 남은 적의 뒤로 돌아가세요.',7000)}
    else toast(e.ch+' 흡수 · '+(state.combo>=2?state.combo+'연속! 빠른 발동':'먹물 +1 · 속도 증가'));
    saveRecord();
    if(state.kills===state.enemies.length){state.mode='won';state.held=null;openDialog('win')}
    else state.mode='playing';
    updateUI();
  }
  function startAbsorb(e,now){
    if(state.absorbEvent)return;
    state.absorbEvent={enemyId:e.id,from:now,until:now+290,ch:e.ch,x:e.x,y:e.y,ox:state.player.x,oy:state.player.y};
    state.mode='absorbing';
    state.held=null;
    tone(250,.05,'triangle',.02);
  }
  function die(now,why='정면에서 잡혔습니다.'){
    if(state.mode!=='playing')return;
    state.deathReason=why;saveRecord();state.mode='dead';state.held=null;state.flash=now+450;
    tone(150,.28,'sawtooth',.048);
    showMessage(why,Infinity);
    openDialog('dead');
  }
  function canEat(e,oldX,oldY){const d=dirs[e.dir];return oldX===e.x-d.x&&oldY===e.y-d.y}
  function movePlayer(dirName,now=gameNow()){
    if(state.mode!=='playing')return false;
    const d=dirs[dirName];if(!d)return false;
    state.lastPlayerStep=now;
    const p=state.player;const ox=p.x,oy=p.y;p.dir=dirName;
    const x=ox+d.x,y=oy+d.y;if(!valid(x,y))return false;
    const e=enemyAt(x,y);
    if(e){if(canEat(e,ox,oy)){startAbsorb(e,now)}else{die(now,'정면 또는 측면에서 부딪쳤습니다. 반드시 뒤에서 접근하세요.');updateUI();return false}}
    else{
      const t=tile(x,y);
      if(t==='#'){tone(120,.045,'triangle',.012);return false}
      if(t!==' '&&t!=='+'&&!state.unlocks.has(t)){toast(t+' 적을 흡수해야 '+t+' 벽을 먹을 수 있습니다.',1500);tone(110,.06,'triangle',.017);return false}
      if(t!==' '){setTile(x,y,' ');tone(250,.095,'square',.024);if(t==='+'){state.walls=state.walls.filter(w=>w.x!==x||w.y!==y);toast('내가 쓴 벽을 지웠습니다.',800)}else if(!state.breached.has(t)){state.breached.add(t);state.stage=Math.max(state.stage,t==='@'?1:2);state.enemies.forEach(en=>{
        if(en.zone===state.stage){
          en.wake=now+1100+(en.id%4)*450;
          if(en.zone===state.stage&&en.style!=='tutorial'&&Math.abs(en.x-x)+Math.abs(en.y-y)<7){
            en.goal={x,y};en.seenUntil=now+5200;en.searchUntil=now+5200;
          }
        }
      });toast(t+' 벽 삭제 · 새로운 미로 개방',2500);showMessage('새로 열린 통로로 적도 들어옵니다. 기존 미로를 활용해 뒤를 잡으세요.',5500);updateUI()}else{toast('벽을 지웠습니다.',650)}}
      state.trail.push({x:ox,y:oy,from:now,dir:p.dir});
      p.prevX=ox;p.prevY=oy;p.movedAt=now;p.x=x;p.y=y;
      tickSound();
    }
    reveal(now);
    state.lastPlayerStep=now;updateUI();return true;
  }
  function hasStraightSight(e){
    const p=state.player,d=dirs[e.dir],dx=p.x-e.x,dy=p.y-e.y;
    const dist=Math.abs(dx)+Math.abs(dy);
    if(dist>6||dist===0)return false;
    if(d.x!==0){if(dy!==0||Math.sign(dx)!==d.x)return false}
    else{if(dx!==0||Math.sign(dy)!==d.y)return false}
    for(let j=1;j<dist;j++)if(!isFloor(e.x+d.x*j,e.y+d.y*j))return false;
    return true;
  }
  function navigate(e,target){
    const start=idx(e.x,e.y),targetI=idx(target.x,target.y),queue=[start],came=new Map([[start,null]]);
    let head=0;
    while(head<queue.length){const i=queue[head++];if(i===targetI)break;
      const x=i%W,y=Math.floor(i/W);
      for(const name of ['up','right','down','left']){const d=dirs[name],nx=x+d.x,ny=y+d.y,ni=idx(nx,ny);if(valid(nx,ny)&&isFloor(nx,ny)&&!came.has(ni)&&(!enemyAt(nx,ny)||(nx===target.x&&ny===target.y))){came.set(ni,{i,dir:name});queue.push(ni)}}
    }
    if(!came.has(targetI))return null;
    let cur=targetI,first=null;while(cur!==start){const n=came.get(cur);first=n.dir;cur=n.i}
    return first;
  }
  function aiStep(e,now){
    if(state.mode!=='playing'||!e.alive||e.zone>state.stage||now<e.wake||e.style==='tutorial')return;
    if(e.turn){e.dir=e.turn;e.turn=null;e.windup=0;return;}
    if(hasStraightSight(e)){
      // Readable personalities: the % creature anticipates two tiles ahead;
      // the & creature pursues the last observed position, never omnisciently.
      let goal={x:state.player.x,y:state.player.y};
      if(e.style==='ambusher'){
        const d=dirs[state.player.dir];
        for(let n=2;n>=1;n--){const ax=state.player.x+d.x*n,ay=state.player.y+d.y*n;
          if(!isFloor(state.player.x+d.x,state.player.y+d.y))break;
          if(isFloor(ax,ay)){goal={x:ax,y:ay};break}}
      }
      e.goal=goal;e.seenUntil=now+3200;e.alertUntil=now+1100;
    }else if((!e.goal||now>=e.seenUntil)&&e.style!=='tutorial'){
      // A recent moving trace is a clue, not the player's real-time position.
      const nearby=state.trail.slice().reverse().find(t=>now-t.from<1950&&Math.abs(t.x-e.x)+Math.abs(t.y-e.y)<=4&&isFloor(t.x,t.y)&&navigate(e,t)!==null);
      if(nearby){e.goal={x:nearby.x,y:nearby.y};e.seenUntil=now+1600;e.searchUntil=now+1600}
    }
    const choices=names.filter(name=>{const d=dirs[name];const x=e.x+d.x,y=e.y+d.y;return isFloor(x,y)&&!enemyAt(x,y)});
    if(!choices.length)return;
    let direction=null;
    if(e.goal&&now<e.seenUntil){
      direction=navigate(e,e.goal);
      if(!direction || (e.goal.x===e.x&&e.goal.y===e.y)){e.goal=null;e.seenUntil=0}
    }
    if(!direction){
      // Wanderers favour forward movement; hunters investigate junctions.
      const forward=choices.includes(e.dir);
      if(forward&&Math.random()<(e.style==='wander'?.76:.55))direction=e.dir;
      else{
        const opposite=names.find(name=>dirs[name].x===-dirs[e.dir].x&&dirs[name].y===-dirs[e.dir].y);
        const preferred=choices.filter(n=>n!==opposite);
        const options=preferred.length?preferred:choices;
        direction=options[Math.floor(Math.random()*options.length)];
      }
    }
    if(!direction)return;
    if(e.dir!==direction){e.turn=direction;e.windup=0;return} // Keep the current vulnerable rear until the announced turn commits.
    const d=dirs[e.dir],nx=e.x+d.x,ny=e.y+d.y;
    if(!isFloor(nx,ny))return;
    if(nx===state.player.x&&ny===state.player.y){
      // Seeing the jaw one cell away gives one enemy beat to dodge. Contact remains fatal.
      if(!e.windup || now-e.windup>e.speed*2.2){
        e.windup=now;e.alertUntil=now+e.speed*1.4;
        e.goal={x:state.player.x,y:state.player.y};e.seenUntil=now+e.speed*1.5;
        return;
      }
      if(now-e.windup>=e.speed*.65){die(now,'적의 입이 닿았습니다. 경고 !가 보이면 방향을 바꿔 도망치세요.');return}
      return;
    }
    e.windup=0;
    if(enemyAt(nx,ny))return;
    e.prevX=e.x;e.prevY=e.y;e.movedAt=now;e.x=nx;e.y=ny;
  }
  function updateUI(){
    $('killCount').textContent=String(state.kills);$('totalEnemies').textContent=String(state.enemies.length);
    const unlocked=state.unlocks.has('@');
    $('abilities').textContent=state.unlocks.size?[...state.unlocks].join(' · ')+' 벽 통과 가능':'방향키 / WASD로 이동';
    for(const id of ['btnWrite','btnMobileWrite']){
      const button=$(id);button.hidden=!unlocked;
      button.disabled=!state.ink||state.mode!=='playing';
      button.textContent='길 막기 ('+state.ink+'회)'+(id==='btnWrite'?' [SPACE]':'');
    }
    $('btnPause').textContent=state.mode==='paused'?'계속하기':'일시정지';
  }
  function openDialog(type){
    const content={
      intro:{meta:'문자 사냥',title:'뒤를 잡아, 길을 열자.',body:'검은 입이 나입니다. 적의 열린 쪽을 피해 뒤에서 다가가세요.',list:['방향키로 이동합니다. 휴대폰에서는 아래 방향키를 누르세요.','@를 먹으면 @ 벽을 통과할 수 있습니다.'],primary:'시작'},
      dead:{meta:'GAME OVER',title:'이번엔 내가 먹혔다.',body:state.deathReason||'상대의 뒤로 돌아가려면 순환로와 코너를 이용하세요.',list:['흡수 기록: '+state.kills+' / '+state.enemies.length,'다음 시도에서는 적이 몸을 돌리는 시간도 노려 보세요.'],primary:'다시 시작 ↻'},
      win:{meta:'WORLD CLEAR',title:'이 세계를 전부 먹었다.',body:'처음엔 문자 하나였지만, 적을 흡수하고 벽을 지워 세계를 직접 확장했습니다.',list:['흡수한 적: '+state.kills,'획득 문자: '+[...state.unlocks].join(' ') ,'이 미로의 핵심 재미가 검증됐는지 판단해 보세요.'],primary:'한 번 더 플레이 ↻'},
      pause:{meta:'PAUSED',title:'일시정지',body:'코너를 돌아 상대의 등 뒤로 접근하세요.',list:['방향키 / WASD 이동','P 를 눌러 재개할 수 있습니다.'],primary:'계속하기'}
    }[type];
    state.dialogType=type;$('dialogMeta').textContent=content.meta;$('dialogTitle').textContent=content.title;$('dialogBody').textContent=content.body;
    $('dialogList').innerHTML='';for(const item of content.list){const li=document.createElement('li');li.textContent=item;$('dialogList').append(li)}
    $('btnPrimary').textContent=content.primary;$('scrim').classList.remove('hidden');
  }
  function closeDialog(){const fresh=['intro','dead','won'].includes(state.mode);if(state.mode==='dead'||state.mode==='won')buildMap();state.mode=fresh?'playing':state.resumeMode||'playing';$('scrim').classList.add('hidden');const n=gameNow();if(fresh)state.enemies.forEach(e=>{e.wake=n+1500;e.lastStep=n});state.lastPlayerStep=n;canvas.focus({preventScroll:true});updateUI()}
  function mouthOpen(now,lastStep,base=1.02,boost=.24){
    // Each grid step makes the mouth open-then-close once; the idle gape remains wide.
    const age=now-lastStep;
    const phase=age>=150?0:Math.sin(Math.PI*Math.max(0,age)/150);
    return base+boost*phase;
  }
  function mouthGeometry(cx,cy,dir,open,size){
    const d=dirs[dir];
    const px=-d.y,py=d.x; // a perpendicular vector to the direction of the OPEN side
    const backX=cx-d.x*size*.51,backY=cy-d.y*size*.51;
    const frontX=cx+d.x*size*.52,frontY=cy+d.y*size*.52;
    const gap=size*.45*open;
    return {backX,backY,upX:frontX+px*gap,upY:frontY+py*gap,downX:frontX-px*gap,downY:frontY-py*gap};
  }
  function drawMouth(cx,cy,dir,open,color,size=17,lineWidth=4.1){
    const m=mouthGeometry(cx,cy,dir,open,size);
    ctx.strokeStyle=color;ctx.lineWidth=lineWidth;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(m.upX,m.upY);ctx.lineTo(m.backX,m.backY);ctx.lineTo(m.downX,m.downY);ctx.stroke();
  }
  // Typography-inspired monsters: @ winds around its "a" eye and leaves an open tail.
  // All species rotate their own silhouette toward the facing direction.
  function drawEnemyGlyph(cx,cy,e,now){
    const blink=state.absorbEvent&&state.absorbEvent.enemyId===e.id;
    const age=blink?now-state.absorbEvent.from:0;
    if(blink&&Math.floor(age/49)%2===1)return;
    const t=blink?Math.min(1,age/290):0;
    const scale=blink?1-t*.78:1;
    const fade=blink?Math.max(.22,1-t*.72):1;
    const angle={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[e.dir];
    ctx.save();
    const toP=blink?Math.min(.58,t*.58):0;
    const targetX=blink?state.absorbEvent.ox:0,targetY=blink?state.absorbEvent.oy:0;
    ctx.translate(cx+(targetX-e.x)*CELL*toP,cy+(targetY-e.y)*CELL*toP);
    ctx.rotate(angle);ctx.scale(scale,scale);ctx.globalAlpha=fade;
    const tone=e.ch==='@'?'#51565C':e.ch==='&'?'#806449':'#8B7198';
    ctx.lineCap='round';ctx.lineJoin='round';
    if(e.ch==='@'){
      // The right-hand opening is the natural unfinished end of the @ spiral.
      const breathe=mouthOpen(now,e.lastStep,.84,.12);
      const aperture=.60*breathe;
      ctx.strokeStyle=tone;ctx.lineWidth=3.1;
      ctx.beginPath();ctx.arc(-1.1,0,9.5,aperture,Math.PI*2-aperture);ctx.stroke();
      // The inner lowercase 'a' doubles as an eye, with a living pupil.
      ctx.strokeStyle=tone;ctx.lineWidth=2.3;
      ctx.beginPath();ctx.arc(-2.5,0.0,3.5,-.3,Math.PI*1.75);ctx.stroke();
      ctx.beginPath();ctx.moveTo(.7,-2.2);ctx.quadraticCurveTo(4.7,-5.5,7.0,-2.6);ctx.stroke();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-2.5,-.4,1.35,0,Math.PI*2);ctx.fill();
    }else if(e.ch==='&'){
      // Ampersand's terminal strokes become a small open jaw without erasing its body.
      ctx.font='bold 22px Georgia, "Times New Roman", serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=tone;ctx.fillText('&',-2,0);
      ctx.strokeStyle=tone;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(3,-4.6);ctx.quadraticCurveTo(7,-8,9,-8);ctx.moveTo(4,4.6);ctx.quadraticCurveTo(7,7,9,7);ctx.stroke();
      ctx.fillStyle='#252525';ctx.beginPath();ctx.arc(-2,-3,1.1,0,Math.PI*2);ctx.fill();
    }else{
      // Percent sign: two round eyes and a slash that splits into jaws at the leading end.
      ctx.font='bold 21px Georgia, "Times New Roman", serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=tone;ctx.fillText('%',-2,0);
      ctx.strokeStyle=tone;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(2,-2);ctx.lineTo(10,-5.7);ctx.moveTo(2,2);ctx.lineTo(10,5.7);ctx.stroke();
    }
    ctx.restore();
  }
  function drawPlayerEvolution(cx,cy,dir,now){
    const eat=state.absorbEvent;
    const opening=eat?(now-eat.from<190?1.38:.96):mouthOpen(now,state.lastPlayerStep,1.0,.26);
    // One silhouette throughout: the opening always communicates facing.
    drawMouth(cx,cy,dir,opening,'#181818',15.4,3.6);
  }
  const restartGame=()=>{buildMap();state.mode='playing';$('scrim').classList.add('hidden');state.enemies.forEach(e=>e.wake=gameNow()+1500);canvas.focus({preventScroll:true});updateUI()};
  const toggleMap=()=>{state.overview=!state.overview};
  $('btnPrimary').onclick=closeDialog;
  $('btnPause').onclick=()=>{if(state.mode==='playing'||state.mode==='absorbing'){state.resumeMode=state.mode;state.mode='paused';state.held=null;openDialog('pause');updateUI()}else if(state.mode==='paused')closeDialog()};
  $('btnWrite').onclick=()=>writeWall();$('btnMobileWrite').onclick=()=>writeWall();
  function inputDir(key){return {ArrowUp:'up',KeyW:'up',ArrowRight:'right',KeyD:'right',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left'}[key]}
  document.addEventListener('keydown',event=>{
    const direction=inputDir(event.code);
    if(direction){event.preventDefault();if(state.mode==='playing'){if(state.held!==direction){state.held=direction;movePlayer(direction)} }return}
    if(event.code==='Space'&&state.mode==='playing'){event.preventDefault();writeWall();return}
    if(event.repeat&&!direction)return;
    if(event.code==='Tab'){event.preventDefault();toggleMap();return}
    if(event.code==='KeyR'){event.preventDefault();restartGame()}
    if(event.code==='KeyP'||event.code==='Escape'){event.preventDefault();$('btnPause').click()}
    if((event.code==='Enter'||event.code==='Space')&&['intro','paused','dead','won'].includes(state.mode)){event.preventDefault();$('btnPrimary').click()}
  });
  document.addEventListener('keyup',event=>{const d=inputDir(event.code);if(d&&state.held===d)state.held=null});
  const releaseInput=()=>{state.held=null;activePointer=null};
  const autoPause=()=>{releaseInput();if(state.mode==='playing'||state.mode==='absorbing')$('btnPause').click()};
  window.addEventListener('blur',autoPause);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause()});
  let activePointer=null;
  for(const b of document.querySelectorAll('.dir')){
    b.addEventListener('pointerdown',ev=>{ev.preventDefault();if(state.mode!=='playing')return;activePointer=ev.pointerId;b.setPointerCapture(ev.pointerId);const d=b.dataset.dir;state.held=d;movePlayer(d)});
    for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,ev=>{if(ev.pointerId===activePointer)releaseInput()});
  }
  let touchStart=null;
  canvas.addEventListener('touchstart',ev=>{if(ev.touches.length===1)touchStart={x:ev.touches[0].clientX,y:ev.touches[0].clientY}},{passive:true});
  canvas.addEventListener('touchend',ev=>{if(!touchStart||!ev.changedTouches.length)return;const dx=ev.changedTouches[0].clientX-touchStart.x,dy=ev.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;movePlayer(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
  function render(now){
    const p=state.player;
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W*CELL,H*CELL);
    // The original central maze stays fixed, while the camera gently reveals more of its perimeter.
    const targetZoom=state.overview?1:[1.72,1.22,1][state.stage];
    state.zoom=state.zoom===undefined?targetZoom:state.zoom+(targetZoom-state.zoom)*0.065;
    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.scale(state.zoom,state.zoom);
    ctx.translate(-canvas.width/2,-canvas.height/2);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='19px Consolas, "Courier New", monospace';
    const hasAt=state.unlocks.has('@'),hasAnd=state.unlocks.has('&');
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const i=idx(x,y),t=tile(x,y);if(!state.revealed[i]||t===' ')continue;
      const alpha=state.revealAt[i]===0?1:Math.min(1,Math.max(0,(now-state.revealAt[i])/350));
      ctx.globalAlpha=alpha;
      ctx.fillStyle=t==='#'?'#474747':t==='@'?(hasAt?'#7795b3':'#989898'):t==='&'?(hasAnd?'#b79672':'#989898'):'#888';
      ctx.fillText(t,x*CELL+CELL/2,y*CELL+CELL/2+1);
    }
    ctx.globalAlpha=1;
    // Breathe on the next unlocked gate so the player spots where to explore.
    const gate=state.unlocks.has('%')?'%':state.unlocks.has('&')?'&':state.unlocks.has('@')?'@':null;
    if(gate){
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='19px Consolas, "Courier New", monospace';
      for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(tile(x,y)===gate&&state.revealed[idx(x,y)]){
        const a=.12+.12*(.5+.5*Math.sin(now/270));
        ctx.fillStyle=gate==='@'?'rgba(66,113,150,'+a+')':'rgba(152,108,71,'+a+')';
        ctx.beginPath();ctx.arc((x+.5)*CELL,(y+.5)*CELL,12,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
    // Player-written type fades as its eight-second lifetime runs out.
    for(const wall of state.walls){
      const remain=Math.max(0,(wall.until-now)/8000),cx=(wall.x+.5)*CELL,cy=(wall.y+.5)*CELL;
      ctx.save();ctx.globalAlpha=.28+.50*remain;ctx.strokeStyle='#474747';ctx.lineWidth=1;
      ctx.strokeRect(cx-10,cy-10,20,20);ctx.restore();
    }
    state.trail=state.trail.filter(t=>now-t.from<1950);
    // A light dotted line in front of each enemy makes facing readable without UI clutter.
    for(const e of state.enemies){if(!e.alive||e.zone>state.stage||!state.revealed[idx(e.x,e.y)])continue;
      const d=dirs[e.dir];
      ctx.fillStyle=e.alertUntil>now?'rgba(173,80,80,.21)':'rgba(70,70,70,.14)';
      for(let j=1;j<=3;j++){const x=e.x+d.x*j,y=e.y+d.y*j;if(!valid(x,y)||tile(x,y)!==' '||!state.revealed[idx(x,y)])break;ctx.beginPath();ctx.arc((x+.5)*CELL,(y+.5)*CELL,1.6,0,Math.PI*2);ctx.fill()}
    }
    for(const e of state.enemies){if(!e.alive||e.zone>state.stage||!state.revealed[idx(e.x,e.y)])continue;
      const dt=Math.min(1,Math.max(0,(now-(e.movedAt||0))/120));
      const ease=1-Math.pow(1-dt,3);
      const cx=((e.prevX??e.x)+(e.x-(e.prevX??e.x))*ease+.5)*CELL;
      const cy=((e.prevY??e.y)+(e.y-(e.prevY??e.y))*ease+.5)*CELL;
      drawEnemyGlyph(cx,cy,e,now);
      if(e.turn){ctx.font='bold 14px monospace';ctx.fillStyle='#775f39';ctx.fillText({up:'↑',right:'→',down:'↓',left:'←'}[e.turn],cx,cy-17)}
      if(e.alertUntil>now){ctx.font='bold 13px Consolas,monospace';ctx.fillStyle='#a74c44';ctx.fillText('!',cx+13,cy-12)}
      else if(e.goal&&e.seenUntil>now){ctx.font='12px Consolas,monospace';ctx.fillStyle='#708291';ctx.fillText('?',cx+13,cy-12)}
    }
    const anim=state.absorbEvent;
    const t=anim?Math.min(1,Math.max(0,(now-anim.from)/290)):0;
    const travel=anim?(.78*(1-Math.pow(1-t,3))):0;
    const lerp=1-Math.pow(1-Math.min(1,Math.max(0,(now-p.movedAt)/105)),3);
    const pcx=anim?(p.x+.5)*CELL+(anim.x-anim.ox)*CELL*travel:((p.prevX??p.x)+(p.x-(p.prevX??p.x))*lerp+.5)*CELL;
    const pcy=anim?(p.y+.5)*CELL+(anim.y-anim.oy)*CELL*travel:((p.prevY??p.y)+(p.y-(p.prevY??p.y))*lerp+.5)*CELL;
    drawPlayerEvolution(pcx,pcy,p.dir,now);
    // The page lights up briefly when a character is absorbed.
    if(now<state.flash){ctx.fillStyle='rgba(230,235,238,'+(0.16*(state.flash-now)/230)+')';ctx.fillRect(0,0,canvas.width,canvas.height)}
    state.particles=state.particles.filter(o=>now-o.from<o.life);
    for(const o of state.particles){const t=(now-o.from)/1000;ctx.globalAlpha=Math.max(0,1-(now-o.from)/o.life);ctx.fillStyle=o.ch==='@'?'#718fac':o.ch==='&'?'#c48b58':'#ad739f';ctx.beginPath();ctx.arc(o.x+o.vx*t,o.y+o.vy*t,2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
    ctx.restore();
  }
  function frame(timestamp){
    const elapsed=Math.max(0,Math.min(100,timestamp-lastTick));lastTick=timestamp;
    if(state.mode==='playing'||state.mode==='absorbing')gameTime+=elapsed;
    const now=gameNow();
    if(state.mode==='playing'){
      updateWalls(now);
      const interval=145/playerSpeed();
      if(state.held&&now-state.lastPlayerStep>interval)movePlayer(state.held,now);
      for(const e of state.enemies){if(!e.alive||e.zone>state.stage||now<e.wake)continue;if(now-e.lastStep>=e.speed){e.lastStep=now;aiStep(e,now)}}
    } else if(state.mode==='absorbing'&&state.absorbEvent){
      if(now>=state.absorbEvent.until){
        const target=state.enemies.find(e=>e.id===state.absorbEvent.enemyId&&e.alive);
        const ev=state.absorbEvent;
        state.absorbEvent=null;
        if(target){state.player.prevX=ev.ox;state.player.prevY=ev.oy;state.player.movedAt=now-100;state.player.x=ev.x;state.player.y=ev.y;state.trail.push({x:ev.ox,y:ev.oy,from:now,dir:state.player.dir});finalizeAbsorb(target,now);reveal(now)}
        else state.mode='playing';
      }
    }
    if(state.toastUntil&&now>state.toastUntil){$('toast').classList.remove('show');state.toastUntil=0}
    if(state.messageUntil!==Infinity&&now>state.messageUntil){state.messageUntil=Infinity;$('hint').textContent='적의 열린 쪽을 피해, 뒤에서 다가가세요.'}
    if(now-state.lastFrame>25||state.mode!=='playing'){
      render(now);state.lastFrame=now
    }
    requestAnimationFrame(frame)
  }
  // Small deterministic hook for local automated smoke tests.
  window.__TEXT_HUNTER_TEST__={snapshot:()=>({mode:state.mode,x:state.player.x,y:state.player.y,dir:state.player.dir,kills:state.kills,stage:state.stage,absorb:state.absorbEvent?{...state.absorbEvent}:null,ink:state.ink,walls:state.walls.map(w=>({x:w.x,y:w.y})),overview:state.overview,combo:state.combo,bestCombo:state.bestCombo,absorbed:state.absorbed.map(a=>a.ch),unlocks:[...state.unlocks],time:gameNow(),speed:playerSpeed(),enemies:state.enemies.filter(e=>e.alive).map(e=>({id:e.id,ch:e.ch,x:e.x,y:e.y,dir:e.dir,turn:e.turn,zone:e.zone,style:e.style,goal:e.goal,wake:e.wake})),map:state.map.map(r=>r.join(''))}),move:dir=>movePlayer(dir),reset:()=>buildMap()};
  buildMap();openDialog('intro');requestAnimationFrame(frame);
})();
